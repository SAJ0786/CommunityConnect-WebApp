<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Community Events Australia</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Download Community Events App to keep connected with community.">
  <meta property="og:title" content="Community Events Australia">
  <meta property="og:description" content="Download Community Events App to keep connected with community.">
  <meta property="og:image" content="https://communityconnect.siza.info/icons/icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:url" content="https://communityconnect.siza.info/app">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Community Events Australia">
  <meta name="twitter:description" content="Download Community Events App to keep connected with community.">
  <meta name="twitter:image" content="https://communityconnect.siza.info/icons/icon-512.png">
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--cc-text);
    }

    .fallback {
      min-height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .fallback.is-visible {
      display: flex;
    }

    .panel {
      max-width: 360px;
      width: 100%;
    }

    .logo {
      width: 88px;
      height: 88px;
      object-fit: contain;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.35rem;
      line-height: 1.2;
    }

    p {
      margin: 0 0 18px;
      color: var(--cc-muted);
      font-size: 0.98rem;
      line-height: 1.45;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    a.button {
      display: block;
      padding: 13px 16px;
      border-radius: 12px;
      text-decoration: none;
      border: 1px solid var(--cc-primary);
      color: var(--cc-primary);
      font-weight: 800;
    }

    a.button.primary {
      background: var(--cc-primary);
      color: #ffffff;
    }

    a {
      color: var(--cc-primary);
      font-weight: 800;
    }
  </style>
<link rel="stylesheet" href="/static-pages.css"/>
</head>
<body>
  <main class="fallback" id="fallback">
    <div class="panel">
      <img class="logo" src="/icons/icon-192.png" alt="Community Events Australia">
      <h1>Open Community Events Australia</h1>
      <p id="fallbackText">Opening the correct app store. If it does not open, use the button below.</p>
      <div class="actions">
        <a class="button primary" id="storeLink" href="/">Download or open app</a>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      var isAndroid = /Android/i.test(ua);
      var iosStore = "https://apps.apple.com/au/app/community-events-australia/id6782770347";
      var androidStore = "https://play.google.com/store/apps/details?id=info.siza.communityevents.app";
      var microsoftStore = "https://apps.microsoft.com/detail/9NDGJZHL86KJ";
      var webApp = "https://communityconnect.siza.info/";
      var fallback = document.getElementById("fallback");
      var fallbackText = document.getElementById("fallbackText");
      var storeLink = document.getElementById("storeLink");

      function showFallback(storeUrl, message) {
        storeLink.href = storeUrl || webApp;
        if (message) fallbackText.textContent = message;
        fallback.className = "fallback is-visible";
      }

      if (isAndroid) {
        var intentUrl = "intent://communityevents.siza.info/app#Intent;scheme=https;package=info.siza.communityevents.app;S.browser_fallback_url=" + encodeURIComponent(androidStore) + ";end";
        storeLink.href = androidStore;
        window.location.replace(intentUrl);
        setTimeout(function () { showFallback(androidStore); }, 1200);
        return;
      }

      if (isIOS) {
        storeLink.href = iosStore;
        window.location.replace(iosStore);
        setTimeout(function () { showFallback(iosStore, "Open Community Events Australia from the App Store."); }, 1200);
        return;
      }

      storeLink.href = microsoftStore;
      window.location.replace(microsoftStore || webApp);
      setTimeout(function () { showFallback(webApp); }, 1200);
    }());
  </script>
</body>
</html>
