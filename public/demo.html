<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Events — App Demo</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--cc-background); min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 24px;
    }
    .card {
      background: var(--cc-surface); border: 1px solid var(--cc-border);
      border-radius: 24px; width: 100%; max-width: 420px;
      overflow: hidden; box-shadow: 0 24px 64px rgba(0,0,0,0.6);
    }
    .slide-header {
      padding: 36px 28px 24px; text-align: center;
      border-bottom: 3px solid var(--cc-primary);
      transition: background 0.3s;
    }
    .slide-icon { font-size: 58px; line-height: 1; margin-bottom: 16px; }
    .slide-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
    .slide-subtitle { font-size: 14px; line-height: 1.65; color: var(--cc-text); }
    .tip-box {
      margin: 16px 0 0; padding: 11px 14px;
      border-radius: 10px; font-size: 12px; line-height: 1.5;
      border-left: 3px solid var(--cc-primary);
      background: var(--cc-primary-soft); color: var(--cc-primary);
      display: none;
    }
    .tip-area { min-height: 68px; padding: 0 24px; }
    .dots { display: flex; justify-content: center; gap: 8px; padding: 16px 24px 0; }
    .dot {
      height: 8px; border-radius: 4px; cursor: pointer;
      background: var(--cc-border); border: none;
      transition: all 0.3s; padding: 0;
    }
    .dot.active { background: var(--cc-primary); }
    .actions { display: flex; gap: 8px; padding: 16px 24px 20px; }
    .btn-skip {
      flex: 1; font-size: 13px; padding: 11px;
      border-radius: 10px; border: 1px solid var(--cc-border);
      background: transparent; color: var(--cc-muted); cursor: pointer;
    }
    .btn-next {
      flex: 2; font-size: 14px; font-weight: 700; padding: 11px;
      border-radius: 10px; border: none;
      background: var(--cc-primary); color: var(--cc-on-primary); cursor: pointer;
    }
    .btn-next:hover { background: var(--cc-primary-strong); }
    .counter { text-align: center; font-size: 11px; color: var(--cc-muted); padding-bottom: 16px; }
    .footer { margin-top: 24px; text-align: center; }
    .footer a {
      display: inline-block; padding: 13px 28px;
      background: var(--cc-primary); color: var(--cc-on-primary);
      border-radius: 12px; font-weight: 700; font-size: 15px;
      text-decoration: none;
    }
    .footer a:hover { background: var(--cc-primary-strong); }
    .footer p { color: var(--cc-muted); font-size: 12px; margin-top: 12px; }
    .done-screen { padding: 40px; text-align: center; }
    .done-screen p { color: var(--cc-muted); font-size: 14px; margin-top: 8px; }
  </style>
  <link rel="stylesheet" href="/static-pages.css"/>
</head>
<body>
  <a class="static-back-link" href="/">&larr; Back to Home</a>

<div class="card" id="card">
  <div class="slide-header" id="header">
    <div class="slide-icon" id="icon"></div>
    <div class="slide-title" id="title"></div>
    <div class="slide-subtitle" id="subtitle"></div>
  </div>
  <div class="tip-area">
    <div class="tip-box" id="tip"></div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="actions">
    <button class="btn-skip" onclick="finish()">Skip</button>
    <button class="btn-next" id="nextBtn" onclick="next()">Next →</button>
  </div>
  <div class="counter" id="counter"></div>
</div>

<div class="footer">
  <a href="https://communityevents.siza.info" id="appLink">Open Community Events App →</a>
  <p>Free · No account required to browse</p>
</div>

<script>
const SLIDES = [
  {
    icon: '🌙',
    title: 'Community Events Australia',
    subtitle: 'Your free hub for Australian Muslim community events — Majalis, Milad programmes, and more.',
    tip: ''
  },
  {
    icon: '📅',
    title: 'Discover Events',
    subtitle: 'Browse upcoming events from centres and community members. Filter by suburb, organiser type, or time period.',
    tip: 'Tip: Use AI Search — try "Majlis this Friday in Lakemba" and get instant results.'
  },
  {
    icon: '📤',
    title: 'Share Events Instantly',
    subtitle: 'Tap Share on any event card and a fully formatted WhatsApp or SMS message is created for you — no typing needed.',
    tip: 'Tip: Admins can bulk-share multiple events at once from the Bulk Share menu.'
  },
  {
    icon: '🗺️',
    title: 'Navigate Directly',
    subtitle: 'Every event has a Directions button. Tap it to open Maps and get turn-by-turn directions straight from the app.',
    tip: 'Tip: Centre events show the full address. Private events show the suburb to protect privacy.'
  },
  {
    icon: '📅',
    title: 'Series Events',
    subtitle: 'Hosting a multi-day programme like Muharram or Ramadan? Add all consecutive days at once — Gregorian and Hijri dates supported.',
    tip: 'Tip: Series events appear individually in the calendar so attendees can track day by day.'
  },
  {
    icon: '➕',
    title: 'Add & Manage Events',
    subtitle: 'Register free to add your own events, edit them anytime, and receive evening reminders before upcoming events.',
    tip: 'Tip: Sync the live calendar feed to your phone — events update automatically.'
  },
  {
    icon: '📲',
    title: 'Install as an App',
    subtitle: 'Add Community Events to your home screen — loads instantly, works offline, feels like a native app.',
    tip: 'iPhone: Safari → Share → Add to Home Screen. Android: Chrome → ⋮ → Install App.'
  },
  {
    icon: '🚀',
    title: 'Ready to Join?',
    subtitle: 'Browse as a guest or register free with your mobile number. The community is waiting for you.',
    tip: ''
  },
];

let cur = 0;

function render() {
  const s = SLIDES[cur];
  document.getElementById('header').style.background = s.bg;
  document.getElementById('header').style.borderBottomColor = s.color;
  document.getElementById('icon').textContent = s.icon;
  document.getElementById('title').style.color = s.color;
  document.getElementById('title').textContent = s.title;
  document.getElementById('subtitle').textContent = s.subtitle;
  const tip = document.getElementById('tip');
  if (s.tip) { tip.style.display = 'block'; tip.textContent = s.tip; }
  else { tip.style.display = 'none'; }
  document.getElementById('nextBtn').style.background = s.color;
  document.getElementById('nextBtn').textContent = cur < SLIDES.length - 1 ? 'Next →' : '🚀 Open the App';
  document.getElementById('counter').textContent = (cur + 1) + ' of ' + SLIDES.length;
  const dots = document.getElementById('dots');
  dots.innerHTML = SLIDES.map((_, i) => {
    const w = i === cur ? 24 : 8;
    return `<button class="dot ${i===cur?'active':''}" style="width:${w}px" onclick="goTo(${i})"></button>`;
  }).join('');
}

function goTo(i) { cur = i; render(); }
function next() {
  if (cur < SLIDES.length - 1) { cur++; render(); }
  else { window.location.href = 'https://communityevents.siza.info'; }
}
function finish() { window.location.href = 'https://communityevents.siza.info'; }

render();
</script>
</body>
</html>
